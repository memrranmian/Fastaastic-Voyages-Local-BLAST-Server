<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastaastic Voyages - Job Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .status-box { max-width: 600px; margin: 4rem auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card status-box p-4 shadow-sm text-center">
            <h4 class="fw-bold mb-3"><i class="bi bi-compass text-primary"></i> Fastaastic Voyages — Background Search</h4>
            <p class="text-muted">Job Identifier: <span class="font-monospace fw-bold text-dark">{{ job_id }}</span></p>

            <div class="my-4">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <h5 class="mt-3 text-secondary" id="status-text">BLAST search in progress...</h5>
                <p class="small text-muted">Running <strong>{{ job.program }}</strong> against <strong>{{ job.database }}</strong>. This page automatically refreshes upon completion.</p>
            </div>

            <div class="progress mb-3" style="height: 6px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
            </div>

            <div>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">Cancel & Return to Home</a>
            </div>
        </div>
    </div>

    <script>
        const jobId = "{{ job_id }}";
        const pollInterval = setInterval(() => {
            fetch(`/api/job/${jobId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "COMPLETED") {
                        clearInterval(pollInterval);
                        window.location.href = `/results/${jobId}`;
                    } else if (data.status === "FAILED") {
                        clearInterval(pollInterval);
                        document.getElementById('status-text').innerText = "Job Failed: " + (data.error || "Unknown error");
                        document.getElementById('status-text').className = "mt-3 text-danger";
                    }
                })
                .catch(err => console.error(err));
        }, 1500);
    </script>
</body>
</html>
